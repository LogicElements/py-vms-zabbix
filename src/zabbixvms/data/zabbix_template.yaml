zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 45dada3be53d423f8ec10455691a33b2
    name: Templates/Applications
  templates:
  - uuid: f37074f8414e47f2a93850ad6d940053
    template: VMS zabbix agent
    name: VMS zabbix agent
    description: Metriky softwaru VMS odesílané agentem zabbixvms.
    groups:
    - name: Templates/Applications
    items:
    - uuid: a025056c313c4c37b008560e98b5a399
      name: Otáčky turbíny
      type: TRAP
      key: vms.speed
      value_type: FLOAT
      description: Aktuální otáčky turbíny
      units: rpm
    - uuid: 3a84f34e1bf443d2a5db342cb44d793a
      name: Stáří info záznamu
      type: TRAP
      key: vms.info_age
      value_type: UNSIGNED
      description: Doba od poslední aktualizace tabulky `info`. Hodnoty nad jeden měsíc se hlásí jako
        jeden měsíc.
      units: s
    - uuid: b5af6061c19c4011843ad8aa3f7b2415
      name: Stáří timestamp dat
      type: TRAP
      key: vms.timestamp_age
      value_type: UNSIGNED
      description: Doba od posledních přijatých timestamp dat. Hodnoty nad jeden měsíc se hlásí jako jeden
        měsíc.
      units: s
    - uuid: 1c725e79f2cb408a9031ba9d6a77bd06
      name: Stáří konfiguračních dat
      type: TRAP
      key: vms.config_age
      value_type: UNSIGNED
      description: Doba od posledních přijatých konfiguračních dat. Hodnoty nad jeden měsíc se hlásí jako
        jeden měsíc.
      units: s
    - uuid: 1be3a968357b42bfad694d2885f54863
      name: Počet řádků v bufferu 1
      type: TRAP
      key: vms.buf_rows_1
      value_type: UNSIGNED
      description: Počet řádků v první bufferové tabulce
    - uuid: 9a63f827e6a845549fee118f385b2dfc
      name: Počet řádků v bufferu 2
      type: TRAP
      key: vms.buf_rows_2
      value_type: UNSIGNED
      description: Počet řádků v druhé bufferové tabulce
    - uuid: 4ef48f4ba2864fbeb5a94c664e8220de
      name: Stáří bufferu 1
      type: TRAP
      key: vms.buf_age_1
      value_type: UNSIGNED
      description: Doba od posledních dat přijatých do bufferu 1. Hodnoty nad jeden měsíc se hlásí jako
        jeden měsíc.
      units: s
    - uuid: 00dbc7d424f047faaacef40d83cd2e4f
      name: Stáří bufferu 2
      type: TRAP
      key: vms.buf_age_2
      value_type: UNSIGNED
      description: Doba od posledních dat přijatých do bufferu 2. Hodnoty nad jeden měsíc se hlásí jako
        jeden měsíc.
      units: s
    - uuid: 56ebce1768864dd2996bc10b4f878b2b
      name: Doba bulk zápisu 1
      type: TRAP
      key: vms.buf_bulk_1
      value_type: UNSIGNED
      description: Doba zápisu bulk příkazu do databáze pro buffer 1
      units: ms
    - uuid: d4506d28a9ab4d75bf883564ed4e7229
      name: Doba bulk zápisu 2
      type: TRAP
      key: vms.buf_bulk_2
      value_type: UNSIGNED
      description: Doba zápisu bulk příkazu do databáze pro buffer 2
      units: ms
    - uuid: aceaa39a77be47c5acfe687fdc0cfdef
      name: Stav agenta
      type: TRAP
      key: vms.agent_status
      value_type: UNSIGNED
      description: 0 = agent pracuje bez chyby, 1 = varování, 2 = chyba. Popis chyby nese `vms.agent_error`.
      valuemap:
        name: Stav agenta
      triggers:
      - uuid: 4839d6403cb443ca8ec1ea4948914e0a
        expression: last(/VMS zabbix agent/vms.agent_status)>0
        name: Agent hlásí chybu nebo varování
        priority: AVERAGE
      - uuid: e03c986615a04339a63b8f99f03e7c24
        expression: nodata(/VMS zabbix agent/vms.agent_status,5m)=1
        name: Z hostu nepřišla žádná hodnota 5m
        priority: HIGH
    - uuid: 2a536152869e42d39c0b77a952ca8b84
      name: Poslední chyba agenta
      type: TRAP
      key: vms.agent_error
      value_type: CHAR
      description: Text poslední chyby nebo varování agenta; prázdný, když je vše v pořádku.
      triggers:
      - uuid: 04c99cd5862446d195346cbd5a26b96d
        expression: length(last(/VMS zabbix agent/vms.agent_error))>0
        name: 'Chyba agenta: {ITEM.VALUE}'
        priority: AVERAGE
    valuemaps:
    - uuid: 7508a404e6db427c9cb2fcaca34c537c
      name: Stav agenta
      mappings:
      - value: '0'
        newvalue: Bez chyby
      - value: '1'
        newvalue: Varování
      - value: '2'
        newvalue: Chyba
