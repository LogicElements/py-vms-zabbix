zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 45dada3be53d423f8ec10455691a33b2
    name: Templates/Applications
  templates:
  - uuid: f37074f8414e47f2a93850ad6d940053
    template: VMS zabbix agent
    name: VMS zabbix agent
    description: Metriky softwaru VMS odesílané agentem zabbixvms.
    groups:
    - name: Templates/Applications
    items:
    - uuid: a025056c313c4c37b008560e98b5a399
      name: Otáčky turbíny
      type: TRAP
      key: vms.speed
      value_type: FLOAT
      description: Aktuální otáčky turbíny
      units: rpm
      triggers:
      - uuid: e4e70c8b2791485dba5aee84e7745b44
        expression: last(/VMS zabbix agent/vms.speed)<{$VMS.SPEED.NOMINAL}
        name: 'Turbína pod nominálními otáčkami: {ITEM.VALUE}'
        priority: AVERAGE
      - uuid: 48d354cdca704ebf9675ac2db4d8959a
        expression: nodata(/VMS zabbix agent/vms.speed,5m)=1
        name: Z hostu nepřišla žádná hodnota 5m
        priority: HIGH
    - uuid: 3a84f34e1bf443d2a5db342cb44d793a
      name: Stáří info záznamu
      type: TRAP
      key: vms.info_age
      value_type: UNSIGNED
      description: Doba od poslední aktualizace tabulky `info`. Hodnoty nad jeden měsíc se hlásí jako
        jeden měsíc.
      units: s
      triggers:
      - uuid: 2abdc22939b940d18730b46f18d26307
        expression: last(/VMS zabbix agent/vms.info_age)>5m
        name: 'Chyba databáze VMS setupu: {ITEM.VALUE}'
        priority: HIGH
    - uuid: b5af6061c19c4011843ad8aa3f7b2415
      name: Stáří timestamp dat
      type: TRAP
      key: vms.timestamp_age
      value_type: UNSIGNED
      description: Doba od posledních přijatých timestamp dat. Hodnoty nad jeden měsíc se hlásí jako jeden
        měsíc.
      units: s
      triggers:
      - uuid: 1dc8294a8f2e426b847b62e85e36ebe7
        expression: last(/VMS zabbix agent/vms.timestamp_age)>5m
        name: 'Chyba timestamp socketu: {ITEM.VALUE}'
        priority: HIGH
    - uuid: 1c725e79f2cb408a9031ba9d6a77bd06
      name: Stáří konfiguračních dat
      type: TRAP
      key: vms.config_age
      value_type: UNSIGNED
      description: Doba od posledních přijatých konfiguračních dat. Hodnoty nad jeden měsíc se hlásí jako
        jeden měsíc.
      units: s
      triggers:
      - uuid: 0df19bd241174a11a3f207a99a65631c
        expression: last(/VMS zabbix agent/vms.config_age)>5m
        name: 'Chyba konfiguračního socketu: {ITEM.VALUE}'
        priority: HIGH
    - uuid: 98706240c28143d68625ee59fde5804f
      name: Počet řádků v bufferech
      type: TRAP
      key: vms.buf_rows
      value_type: UNSIGNED
      description: Součet počtu řádků přes bufferové tabulky turbíny
      triggers:
      - uuid: 287c381300b149af850cf8f0e4f18b84
        expression: last(/VMS zabbix agent/vms.buf_rows)>100000
        name: 'Chyba SW analýzy čtení bufferu: {ITEM.VALUE}'
        priority: HIGH
    - uuid: 1d6bbea0f0dd42d7aef8d9cd9b2dff5b
      name: Stáří bufferů
      type: TRAP
      key: vms.buf_age
      value_type: UNSIGNED
      description: Doba od posledních dat přijatých do toho bufferu turbíny, který je na tom nejhůř. Hodnoty
        nad jeden měsíc se hlásí jako jeden měsíc.
      units: s
      triggers:
      - uuid: e591aeac83694c0e9f830edac4dff97a
        expression: last(/VMS zabbix agent/vms.buf_age)>5m
        name: 'Chyba ukládání do bufferu: {ITEM.VALUE}'
        priority: HIGH
        dependencies:
        - name: 'Turbína pod nominálními otáčkami: {ITEM.VALUE}'
          expression: last(/VMS zabbix agent/vms.speed)<{$VMS.SPEED.NOMINAL}
    - uuid: 849b5bbd3365482fa084617078b280c5
      name: Doba bulk zápisu
      type: TRAP
      key: vms.buf_bulk
      value_type: UNSIGNED
      description: Součet doby zápisu bulk příkazů do databáze přes buffery turbíny
      units: ms
    - uuid: 3b328c5641a542f283a3494237d0cd66
      name: Počet tabulek surových dat
      type: TRAP
      key: vms.raw_tables
      value_type: UNSIGNED
      description: Největší počet tabulek surových dat se stejným prefixem přes prefixy turbíny
      triggers:
      - uuid: 277a698c78f84841a4738313403b3af0
        expression: last(/VMS zabbix agent/vms.raw_tables)>2
        name: 'Chyba exportu surových dat: {ITEM.VALUE}'
        priority: HIGH
    - uuid: e790bd5704644b8cbd0e5622ca9235d3
      name: Stáří zápisu surových dat
      type: TRAP
      key: vms.raw_write_age
      value_type: UNSIGNED
      description: Doba od posledního zápisu do nejnovější tabulky surových dat u toho prefixu turbíny,
        který je na tom nejhůř. Hodnoty nad jeden měsíc se hlásí jako jeden měsíc.
      units: s
      triggers:
      - uuid: 87e110eb139e489385877d2e0bb737c2
        expression: last(/VMS zabbix agent/vms.raw_write_age)>5m
        name: 'Chyba zápisu surových dat: {ITEM.VALUE}'
        priority: HIGH
        dependencies:
        - name: 'Turbína pod nominálními otáčkami: {ITEM.VALUE}'
          expression: last(/VMS zabbix agent/vms.speed)<{$VMS.SPEED.NOMINAL}
    macros:
    - macro: '{$VMS.SPEED.NOMINAL}'
      value: '2500'
      description: Otáčky, pod kterými se turbína nepovažuje za běžící.
  - uuid: 4af269e3ccbc4b0086d7c51ae3026371
    template: VMS zabbix agent server
    name: VMS zabbix agent server
    description: Metriky serveru VMS odesílané agentem zabbixvms, společné všem turbínám na serveru.
    groups:
    - name: Templates/Applications
    items:
    - uuid: 019f1be946974f9691cbbdeb6a73497b
      name: Nabití baterie UPS
      type: TRAP
      key: ups.charge
      value_type: UNSIGNED
      description: Nabití baterie UPS podle IPP; při více UPS nejnižší z nich
      units: '%'
      triggers:
      - uuid: 44db902d8b3643baaf80702862fd7afb
        expression: last(/VMS zabbix agent server/ups.charge)<{$VMS.UPS.CHARGE.MIN}
        name: 'Chyba napájení: {ITEM.VALUE}'
        priority: HIGH
    - uuid: 5761a77d77924fd6a8ed5a11f13a1994
      name: Stav agenta
      type: TRAP
      key: vms.agent_status
      value_type: UNSIGNED
      description: 0 = cyklus proběhl bez chyby, 1 = varování, 2 = chyba při čtení z databáze nebo z IPP.
        Popis chyby nese `vms.agent_error`.
      valuemap:
        name: Stav agenta
      triggers:
      - uuid: f398dfb734d441ff98e858b51b5020a5
        expression: last(/VMS zabbix agent server/vms.agent_status)>0
        name: Agent hlásí chybu nebo varování
        priority: WARNING
      - uuid: 09aa43759ffb428cba160b891d0f36be
        expression: nodata(/VMS zabbix agent server/vms.agent_status,5m)=1
        name: Z hostu nepřišla žádná hodnota 5m
        priority: HIGH
    - uuid: 7d148dd40da84569a88abf4bf9b2a7a9
      name: Poslední chyba agenta
      type: TRAP
      key: vms.agent_error
      value_type: CHAR
      description: Text poslední chyby nebo varování agenta, u turbíny s jejím názvem na začátku; prázdný,
        když je vše v pořádku.
      triggers:
      - uuid: 628a74ded23249c9a15d34c120e0f527
        expression: length(last(/VMS zabbix agent server/vms.agent_error))>0
        name: 'Chyba agenta: {ITEM.VALUE}'
        priority: AVERAGE
    macros:
    - macro: '{$VMS.UPS.CHARGE.MIN}'
      value: '50'
      description: Nabití baterie v %, pod kterým se hlásí chyba napájení.
    valuemaps:
    - uuid: 8fbb6b58f24d433b9871b8fb18fa8414
      name: Stav agenta
      mappings:
      - value: '0'
        newvalue: Bez chyby
      - value: '1'
        newvalue: Varování
      - value: '2'
        newvalue: Chyba
