[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vms-zabbix-agent"
description = "Zabbix monitoring agent for Logic Elements VMS deployments"
version = "0.1.0"
authors = [
  { name="Jan Bartovský", email="jan.bartovsky@logicelements.cz" },
]
readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
keywords = ["logicelements", "vibration", "vms", "zabbix"]

requires-python = ">=3.7"
dependencies = [
    "pyvms",
    "jsonpickle",
    "zabbix_utils",
    "pywin32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
zabagent = ["data/*.json"]

[project.urls]
"Homepage" = "https://github.com/LogicElements/py-vms-zabbix"
